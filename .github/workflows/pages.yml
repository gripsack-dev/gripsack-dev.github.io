name: pages
run-name: publish-static-${{ inputs.site_commit }}

# website/build.py renders locally; website/publish.py nominates its Git commit.
on:
  workflow_dispatch:
    inputs:
      site_commit:
        description: "Prebuilt static website commit from published-site"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_commit }}
          path: public
          persist-credentials: false
      - name: Require rendered static entrypoints
        run: test -f public/index.html && test -f public/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
