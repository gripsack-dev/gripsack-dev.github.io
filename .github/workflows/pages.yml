name: pages

# gripsack.dev — assembled by website/build.py: the landing page from
# website/, docs pages converted from doc/*.md. Editing a doc in the
# repo is all it takes to update the site.
on:
  workflow_dispatch:
  # The app repo's demo/release workflows ping us to redeploy (fresh
  # demo GIF + version chip) — needs SITE_REPO_TOKEN on their side.
  repository_dispatch:
    types: [rebuild]
  push:
    branches: [main]
    paths:
      - "website/**"
      - "doc/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5

      - name: Build site
        run: uv run --with markdown python website/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
