<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="DejaVu Sans Mono, monospace">
  <!-- gripsack architecture: frontends evaluate modules to span-annotated
       IR (top row, blue); the core compiles it into the store and flips a
       generation (bottom row, green); sourcerers feed bespoke transports
       (peach). Catppuccin Mocha — build.py swaps hexes for site CSS vars,
       so the diagram re-themes with the palette picker. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fab387"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#11111b"/>

  <!-- ===== eval row (blue): describe ===== -->
  <text x="24" y="36" font-size="11" fill="#6c7086">EVAL — in your repo, with your credentials</text>

  <rect x="24" y="56" width="200" height="140" rx="12" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="124" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">your env repo</text>
  <text x="124" y="110" text-anchor="middle" font-size="10.5" fill="#a6adc8">modules/*.py · *.ts</text>
  <text x="124" y="128" text-anchor="middle" font-size="10.5" fill="#a6adc8">env.toml</text>
  <text x="124" y="146" text-anchor="middle" font-size="10.5" fill="#a6adc8">hosts/ · locks/</text>
  <text x="124" y="176" text-anchor="middle" font-size="9.5" fill="#6c7086">self-describing: carries</text>
  <text x="124" y="189" text-anchor="middle" font-size="9.5" fill="#6c7086">its own resolvers</text>

  <rect x="284" y="56" width="190" height="140" rx="12" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="379" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">frontend eval</text>
  <text x="379" y="110" text-anchor="middle" font-size="10.5" fill="#a6adc8">python ≥3.10</text>
  <text x="379" y="128" text-anchor="middle" font-size="10.5" fill="#a6adc8">node ≥18 · bun</text>
  <text x="379" y="146" text-anchor="middle" font-size="10.5" fill="#a6adc8">spans captured here</text>
  <text x="379" y="176" text-anchor="middle" font-size="9.5" fill="#6c7086">subprocess — the core</text>
  <text x="379" y="189" text-anchor="middle" font-size="9.5" fill="#6c7086">never embeds a runtime</text>

  <rect x="534" y="56" width="180" height="140" rx="12" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="624" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9e2af">IR (JSON)</text>
  <text x="624" y="110" text-anchor="middle" font-size="10.5" fill="#a6adc8">modules + spans</text>
  <text x="624" y="128" text-anchor="middle" font-size="10.5" fill="#a6adc8">the contract</text>
  <text x="624" y="158" text-anchor="middle" font-size="9.5" fill="#6c7086">schema/ir/v1.json</text>
  <text x="624" y="176" text-anchor="middle" font-size="9.5" fill="#6c7086">any frontend can emit it</text>

  <rect x="774" y="56" width="162" height="140" rx="12" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="855" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9e2af">lockfile</text>
  <text x="855" y="110" text-anchor="middle" font-size="10.5" fill="#a6adc8">pinned urls</text>
  <text x="855" y="128" text-anchor="middle" font-size="10.5" fill="#a6adc8">+ sha256</text>
  <text x="855" y="158" text-anchor="middle" font-size="9.5" fill="#6c7086">locks/&lt;host&gt;.lock</text>
  <text x="855" y="176" text-anchor="middle" font-size="9.5" fill="#6c7086">reproducible, no sandbox</text>

  <line x1="228" y1="126" x2="278" y2="126" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="478" y1="126" x2="528" y2="126" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="718" y1="126" x2="768" y2="126" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="855" y1="200" x2="855" y2="232" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrg)"/>

  <!-- ===== execute row (green): the core ===== -->
  <text x="24" y="222" font-size="11" fill="#6c7086">EXECUTE — the core, one static musl binary</text>

  <rect x="774" y="236" width="162" height="140" rx="12" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="855" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#a6e3a1">grip core</text>
  <text x="855" y="290" text-anchor="middle" font-size="10.5" fill="#a6adc8">parse → validate</text>
  <text x="855" y="308" text-anchor="middle" font-size="10.5" fill="#a6adc8">resolve → lower</text>
  <text x="855" y="326" text-anchor="middle" font-size="10.5" fill="#a6adc8">→ plan → execute</text>
  <text x="855" y="356" text-anchor="middle" font-size="9.5" fill="#6c7086">compiler passes (0004)</text>

  <rect x="534" y="236" width="180" height="140" rx="12" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="624" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">store</text>
  <text x="624" y="290" text-anchor="middle" font-size="10.5" fill="#a6adc8">/store/&lt;hash&gt;-&lt;name&gt;</text>
  <text x="624" y="308" text-anchor="middle" font-size="10.5" fill="#a6adc8">immutable</text>
  <text x="624" y="326" text-anchor="middle" font-size="10.5" fill="#a6adc8">input-addressed</text>
  <text x="624" y="356" text-anchor="middle" font-size="9.5" fill="#6c7086">fetch + build as a DAG</text>

  <rect x="284" y="236" width="190" height="140" rx="12" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="379" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">generations</text>
  <text x="379" y="290" text-anchor="middle" font-size="10.5" fill="#a6adc8">1..N, immutable</text>
  <text x="379" y="308" text-anchor="middle" font-size="10.5" fill="#a6adc8">current → N</text>
  <text x="379" y="326" text-anchor="middle" font-size="10.5" fill="#a6adc8">one atomic flip</text>
  <text x="379" y="356" text-anchor="middle" font-size="9.5" fill="#6c7086">rollback = flip back</text>

  <rect x="24" y="236" width="200" height="140" rx="12" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="124" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">$HOME</text>
  <text x="124" y="290" text-anchor="middle" font-size="10.5" fill="#a6adc8">configs deployed</text>
  <text x="124" y="308" text-anchor="middle" font-size="10.5" fill="#a6adc8">per ownership mode</text>
  <text x="124" y="326" text-anchor="middle" font-size="10.5" fill="#a6adc8">bin/ on PATH once</text>
  <text x="124" y="356" text-anchor="middle" font-size="9.5" fill="#6c7086">owned · tracked-copy</text>
  <text x="124" y="369" text-anchor="middle" font-size="9.5" fill="#6c7086">merge · template</text>

  <line x1="768" y1="306" x2="720" y2="306" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="528" y1="306" x2="480" y2="306" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="278" y1="306" x2="230" y2="306" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrg)"/>

  <!-- ===== sourcerers (peach) ===== -->
  <rect x="774" y="416" width="162" height="90" rx="12" fill="#1e1e2e" stroke="#fab387" stroke-width="2"/>
  <text x="855" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#fab387">gripsource-*</text>
  <text x="855" y="464" text-anchor="middle" font-size="10" fill="#a6adc8">bespoke transport</text>
  <text x="855" y="481" text-anchor="middle" font-size="10" fill="#a6adc8">NDJSON · stdio</text>
  <text x="855" y="498" text-anchor="middle" font-size="9" fill="#6c7086">bytes hash-verified</text>
  <line x1="855" y1="412" x2="855" y2="382" stroke="#fab387" stroke-width="2" marker-end="url(#arrp)"/>
  <text x="600" y="445" font-size="10" fill="#6c7086">sourcing ladder (0002): built-in args</text>
  <text x="600" y="462" font-size="10" fill="#6c7086">→ eval-time resolvers (your python/TS)</text>
  <text x="600" y="479" font-size="10" fill="#6c7086">→ sourcerer plugins, only if transport</text>
  <text x="600" y="496" font-size="10" fill="#6c7086">itself is bespoke</text>

  <!-- ===== wire example: spans make errors point at your source ===== -->
  <rect x="24" y="516" width="912" height="34" rx="8" fill="#181825"/>
  <text x="40" y="538" font-size="10.5" fill="#a6adc8"><tspan fill="#f38ba8">error[E101]</tspan>: module "helix" depends on unknown module "git"   <tspan fill="#89b4fa">--&gt; modules/helix.py:4:1</tspan>   <tspan fill="#6c7086">— every IR node carries a span back to your source (0004)</tspan></text>
</svg>
