  </g>
  <text x="164" y="103" font-size="34" font-weight="700" letter-spacing="-1.7" fill="#20362d">gripsack</text>
  <text x="1116" y="100" text-anchor="end" font-size="20" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#364940">gripsack.dev</text>
  <path d="M 84 142 H 1116" stroke="#dce1d6" stroke-width="1.5"/>

  <!-- headline -->
  <text x="84" y="196" font-size="19" font-weight="600" letter-spacing="2.5" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#18765b">A DECLARED WORKSPACE · A LITTLE MORE CONTROL</text>
  <text x="84" y="282" font-size="74" font-weight="700" letter-spacing="-3" fill="#20362d">Your environment,</text>
  <text x="84" y="368" font-size="74" font-weight="700" letter-spacing="-3" fill="#20362d">in <tspan fill="#1b604b">one workspace.</tspan></text>

  <!-- sub copy -->
  <text x="84" y="418" font-size="24" fill="#364940">Declare native packages, environments, dotfiles</text>
  <text x="84" y="452" font-size="24" fill="#364940">and tasks in TypeScript. Review before applying.</text>

  <!-- chips -->
  <g font-size="18" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#20362d" text-anchor="middle">
    <rect x="84" y="504" width="293" height="54" rx="5" fill="#fdfdf9" stroke="#a9b8a8" stroke-width="1.5"/>
    <text x="230.5" y="538">packages + environments</text>
    <rect x="395" y="504" width="250" height="54" rx="5" fill="#fdfdf9" stroke="#a9b8a8" stroke-width="1.5"/>
    <text x="520" y="538">profiles + dotfiles</text>
    <rect x="663" y="504" width="217" height="54" rx="5" fill="#fdfdf9" stroke="#a9b8a8" stroke-width="1.5"/>
    <text x="771.5" y="538">tasks + services</text>
  </g>

  <!-- the gripsack mark, site Paper palette -->
  <g transform="translate(720.4,167.6) scale(1.1)" font-family="DejaVu Sans Mono, ui-monospace, monospace">
