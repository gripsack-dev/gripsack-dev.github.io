      <rect x="161" y="62" width="24" height="6" rx="2.5" fill="#18765b"/>
      <rect x="161" y="74" width="30" height="6" rx="2.5" fill="#1a6650"/>
      <rect x="161" y="86" width="20" height="6" rx="2.5" fill="#364940"/>
