    <rect x="176" y="126" width="22" height="16" rx="4" fill="none" stroke="#806223" stroke-width="3.5"/>
    <rect x="282" y="126" width="22" height="16" rx="4" fill="none" stroke="#806223" stroke-width="3.5"/>
    <circle cx="187" cy="162" r="3.2" fill="#806223"/>
    <circle cx="293" cy="162" r="3.2" fill="#806223"/>
    <path d="M 158 212 H 322" stroke="#b87f5c" stroke-width="3.5" stroke-dasharray="8 8" stroke-linecap="round"/>
