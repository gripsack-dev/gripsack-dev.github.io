      <rect x="28" y="18" width="20" height="28" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="2"/>
      <rect x="32" y="25" width="10" height="3" rx="1.5" fill="#89b4fa"/>
      <rect x="32" y="31" width="12" height="3" rx="1.5" fill="#94e2d5"/>
    </g>
    <rect x="49" y="20" width="30" height="22" rx="10" fill="none" stroke="#c9906a" stroke-width="6"/>
    <rect x="26" y="40" width="76" height="60" rx="14" fill="#fab387"/>
    <rect x="26" y="40" width="76" height="24" rx="12" fill="#d1946f"/>
    <rect x="41" y="36" width="8" height="32" rx="2" fill="#b87f5c"/>
