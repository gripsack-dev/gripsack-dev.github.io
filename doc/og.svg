<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="DejaVu Sans, system-ui, sans-serif">
  <!-- gripsack.dev LinkedIn featured thumbnail — site "Paper" palette -->
  <rect width="1200" height="627" fill="#f8f8f3"/>

  <!-- top brand row -->
  <g transform="translate(84,58) scale(0.4375)">
    <rect width="128" height="128" rx="28" fill="#11111b"/>
