<figure class="anim a-own" role="img" aria-label="One destination, four possible live states, each re-checked at write time. Nothing there: gripsack writes it. The file gripsack wrote last time: gripsack updates it. Gripsack's file edited by you since: gripsack preserves your edit and skips it, in apply and in rollback. A file gripsack never wrote: gripsack refuses, unless you pass --take-over, which journals the prior bytes and adopts it.">
<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <text class="a-head" x="12" y="22">what is live at ~/.config/editor/config.toml?</text>
  <text class="a-head" x="768" y="22" text-anchor="end">what gripsack does</text>
  <rect class="a-band" x="300" y="34" width="180" height="258" rx="8"/>
  <text class="a-dim" x="390" y="54" text-anchor="middle">re-checked at write time,</text>
  <text class="a-dim" x="390" y="70" text-anchor="middle">not only at plan time</text>

  <g class="a-row r1">
    <rect class="a-box" x="12" y="84" width="276" height="44" rx="6"/><text class="a-text" x="24" y="111">nothing there</text>
    <line class="a-arrow" x1="288" y1="106" x2="500" y2="106"/><circle class="a-token o-token" cx="300" cy="106" r="5"/>
    <rect class="a-okbox" x="506" y="84" width="262" height="44" rx="6"/><text class="a-ok" x="518" y="111">write it</text>
  </g>
  <g class="a-row r2">
    <rect class="a-box" x="12" y="138" width="276" height="44" rx="6"/><text class="a-text" x="24" y="165">what gripsack wrote last time</text>
    <line class="a-arrow" x1="288" y1="160" x2="500" y2="160"/><circle class="a-token o-token" cx="300" cy="160" r="5"/>
    <rect class="a-okbox" x="506" y="138" width="262" height="44" rx="6"/><text class="a-ok" x="518" y="165">update it</text>
  </g>
  <g class="a-row r3">
    <rect class="a-box" x="12" y="192" width="276" height="44" rx="6"/><text class="a-text" x="24" y="211">gripsack's file, edited by you</text><text class="a-dim" x="24" y="227">drift</text>
    <line class="a-arrow" x1="288" y1="214" x2="500" y2="214"/><circle class="a-token o-token" cx="300" cy="214" r="5"/>
    <rect class="a-keepbox" x="506" y="192" width="262" height="44" rx="6"/><text class="a-ok" x="518" y="211">preserve your edit; skip</text><text class="a-dim" x="518" y="227">in apply and in rollback</text>
  </g>
  <g class="a-row r4">
    <rect class="a-box" x="12" y="246" width="276" height="44" rx="6"/><text class="a-text" x="24" y="265">a file gripsack never wrote</text><text class="a-dim" x="24" y="281">foreign</text>
    <line class="a-arrow" x1="288" y1="268" x2="500" y2="268"/><circle class="a-token o-token" cx="300" cy="268" r="5"/>
    <rect class="a-stopbox" x="506" y="246" width="262" height="44" rx="6"/><text class="a-ok" x="518" y="265">refuse — the plan tells you</text><text class="a-dim" x="518" y="281">--take-over adopts it (prior journaled)</text>
  </g>
</svg>
<figcaption>Every destination is decided on its own, and decided again at write time. Only two of the four cases ever change the file.</figcaption>
</figure>
