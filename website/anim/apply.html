<figure class="anim a-apply" role="img" aria-label="grip apply as six steps in order: 1 record intent in the journal, then a durable barrier; 2 capture the prior bytes and mode of each destination, then a barrier; 3 write each destination after re-checking that what is live is what the plan saw; 4 publish the new generation, sealed and named, then a barrier; 5 flip the current pointer with one atomic rename, then a barrier; 6 cleanup: close the journal and keep the evidence. A barrier is fsync of the file and then of its directory.">
<svg viewBox="0 0 780 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <line class="a-rail" x1="12" y1="30" x2="768" y2="30"/>
  <circle class="a-token" cx="71" cy="30" r="6"/>
  <g class="a-step st1"><rect class="a-box" x="12" y="56" width="118" height="64" rx="6"/><text class="a-num" x="22" y="74">1</text><text class="a-text" x="71" y="88" text-anchor="middle">record intent</text><text class="a-dim" x="71" y="106" text-anchor="middle">journal marker</text></g>
  <g class="a-bar b1"><line x1="135" y1="50" x2="135" y2="126"/><text x="135" y="142" text-anchor="middle">fsync</text></g>
  <g class="a-step st2"><rect class="a-box" x="140" y="56" width="118" height="64" rx="6"/><text class="a-num" x="150" y="74">2</text><text class="a-text" x="199" y="88" text-anchor="middle">capture prior</text><text class="a-dim" x="199" y="106" text-anchor="middle">bytes · mode</text></g>
  <g class="a-bar b2"><line x1="263" y1="50" x2="263" y2="126"/><text x="263" y="142" text-anchor="middle">fsync</text></g>
  <g class="a-step st3"><rect class="a-box" x="268" y="56" width="118" height="64" rx="6"/><text class="a-num" x="278" y="74">3</text><text class="a-text" x="327" y="88" text-anchor="middle">write</text><text class="a-dim" x="327" y="106" text-anchor="middle">re-check, then act</text></g>
  <g class="a-step st4"><rect class="a-box" x="396" y="56" width="118" height="64" rx="6"/><text class="a-num" x="406" y="74">4</text><text class="a-text" x="455" y="88" text-anchor="middle">publish gen N+1</text><text class="a-dim" x="455" y="106" text-anchor="middle">sealed, named</text></g>
  <g class="a-bar b4"><line x1="519" y1="50" x2="519" y2="126"/><text x="519" y="142" text-anchor="middle">fsync</text></g>
  <g class="a-step st5"><rect class="a-box a-key" x="524" y="56" width="118" height="64" rx="6"/><text class="a-num" x="534" y="74">5</text><text class="a-text" x="583" y="88" text-anchor="middle">flip `current`</text><text class="a-dim" x="583" y="106" text-anchor="middle">atomic rename</text></g>
  <g class="a-bar b5"><line x1="647" y1="50" x2="647" y2="126"/><text x="647" y="142" text-anchor="middle">fsync</text></g>
  <g class="a-step st6"><rect class="a-box" x="652" y="56" width="118" height="64" rx="6"/><text class="a-num" x="662" y="74">6</text><text class="a-text" x="711" y="88" text-anchor="middle">cleanup</text><text class="a-dim" x="711" y="106" text-anchor="middle">evidence kept</text></g>
  <text class="a-dim" x="12" y="168">barrier = fsync(file), then fsync(directory): everything left of it is durable</text>
  <text class="a-dim" x="12" y="182">before anything right of it can be seen after a power loss.</text>
  <text class="a-dim" x="12" y="196">1–3 and 6 are the journal · 4 is the store · 5 is the commit point · hooks run after 6, never rolled back</text>
</svg>
<figcaption>One apply, in order. The durable barriers are why a crash at any point leaves either the prior state or the intended one.</figcaption>
</figure>
