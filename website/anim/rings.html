<figure class="anim a-rings">
  <div class="rg-key">
    <strong>Five trust rings</strong>
    <label class="rg-motion"><input type="checkbox" checked> Animate a destination write</label>
  </div>
  <div class="rg-layer rg-product" role="img" aria-label="Five nested trust rings, outside to inside. Ring 4 is the user-facing CLI, tested end to end. Ring 3 admits typed values and verified bytes from untrusted inputs. Ring 2 is the fault-tested host: it performs real I/O under registered assumptions S1–S7. Inside it, ring 1 has Lean-proved state transitions for apply, rollback, recovery, garbage collection, journal ordering, activation and lock publication. Ring 0 has Lean-proved pure decisions about ownership, drift, commit classification and managed-block edits. For a destination write, the decision flows out through a protocol command to the host, which compares the live file before mutating it.">
    <div class="rg-heading"><strong>4 · Product</strong><span>CLI, review and doctor · end-to-end tested</span></div>
    <div class="rg-layer rg-edge">
      <div class="rg-heading"><strong>3 · Edge</strong><span>Checks untrusted config, archives and lockfiles</span></div>
      <div class="rg-layer rg-host">
        <div class="rg-heading"><strong>2 · Host</strong><span>Fault-tested I/O · registered assumptions S1–S7</span></div>
        <div class="rg-layer rg-protocol">
          <div class="rg-heading"><strong>1 · Protocol</strong><span>Lean-proved machine steps</span></div>
          <div class="rg-detail">Apply, rollback, recovery, garbage collection, journal ordering, activation and lock publication: each machine takes observations and issues commands without doing I/O.</div>
          <div class="rg-layer rg-kernel">
            <div class="rg-heading"><strong>0 · Kernel</strong><span>Lean-proved pure decisions</span></div>
            <div class="rg-detail">Who owns these bytes? Did the commit land? Which bytes may a managed-block edit change?</div>
          </div>
        </div>
        <div class="rg-effect">
          <span>Last compare</span>
          <svg viewBox="0 0 96 16" aria-hidden="true">
            <path d="M4 8H91m-6-5 6 5-6 5"/>
            <circle cx="4" cy="8" r="4"/>
          </svg>
          <span>Mutation</span>
        </div>
      </div>
    </div>
  </div>
  <figcaption>The proofs cover decisions and machine steps, not every possible crash and recovery. For a destination write, the host checks that the live file matches what the command expects. A mismatch stops the write. Another writer’s edit between the last comparison and the mutation can still be overwritten (S5).</figcaption>
</figure>
